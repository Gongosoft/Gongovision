# TODO: run linter, fmt:check and builds on pull_request so i can tell if merging something will break stuff

name: Run checks

on:
  pull_request:
    branches: [main]
    paths: [index.html, package.json, '*.lock', '*config.ts', wrangler.toml, src/**, '!src/assets/images/emotes/**']
  push:
    branches: [main]
    paths: [index.html, package.json, '*.lock', '*config.ts', wrangler.toml, src/**, '!src/assets/images/emotes/**']

concurrency:
  group: checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate types
        run: bun run typegen

      - name: Run linter
        run: bun run lint
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run formatter check
        run: bun run fmt:check
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate types
        run: bun run typegen

      - name: Run build
        run: bun run build
